# Винятки для osv-scanner. Кожен запис має причину і дату перегляду.
# Порожній список означає, що всі відомі вразливості з наявним фіксом закриті.

[[IgnoredVulns]]
id = "PYSEC-2026-3447"
ignoreUntil = 2027-03-21
reason = """
setuptools CVE-2026-59890 (GHSA-h35f-9h28-mq5c), CVSS 6.1. Обхід виключень MANIFEST.in
при збірці sdist через нормалізацію Unicode на файлових системах macOS APFS/HFS+.

Не застосовується: ми не збираємо sdist, образ збирається на Linux (python:3.13-alpine),
залежності ставляться через uv sync --frozen з uv.lock.

Не можемо оновитись: фікс у setuptools 83.0.0, але вже 82.0.0 прибрав модуль pkg_resources,
який імпортують openprocurement/audit/api/app.py (iter_entry_points для плагінів), pyramid/path.py і cornice.
Стеля для нас — setuptools 81.0.0, вона вже стоїть. Той самий виняток є в openprocurement.api.

Переглянути: коли app.py перейде на importlib.metadata і Pyramid відмовиться від pkg_resources,
або коли з'явиться бекпорт фіксу в гілку 81.x; не пізніше дати вище.

