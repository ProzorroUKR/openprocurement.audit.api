image: docker:stable
stages:
  - build
  - deploy
  - lint
  - test

variables:
  GIT_STRATEGY: none
  MONGODB_ROOT_PASSWORD: example
  MONGODB_REPLICA_SET_MODE: primary
  MONGODB_REPLICA_SET_NAME: rs0
  MONGODB_REPLICA_SET_KEY: replicaSetKey
  # CS-22510. Security flow: dependency scan (uv.lock) and secret scan of new
  # commits. Non-blocking until the corresponding *_BLOCKING variable is set
  # to "true" in the project CI/CD settings (Settings -> CI/CD -> Variables).
  OSV_SCANNER_IMAGE: "ghcr.io/google/osv-scanner:v2.6.0"
  OSV_BLOCKING: "false"
  GITLEAKS_IMAGE: "ghcr.io/gitleaks/gitleaks:v8.30.1"
  GITLEAKS_BLOCKING: "false"


.build:
  stage: build
  variables:
    IMAGE_TAG: ci-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
    GIT_STRATEGY: fetch
    UV_EXTRA_ARGS: ""
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  tags:
    - kube-dev
  before_script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - >
      /kaniko/executor --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile
      --build-arg UV_EXTRA_ARGS="$UV_EXTRA_ARGS"
      --destination $CI_REGISTRY_IMAGE:$IMAGE_TAG
      --registry-mirror $REGISTRY_MIRROR
      --insecure-registry $REGISTRY_MIRROR
      --skip-tls-verify
      --cache=true


build:
  extends: .build
  only:
    - branches
  variables:
    IMAGE_TAG: ci-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA

build_master:
  extends: .build
  only:
    - master
  variables:
    IMAGE_TAG: latest
    UV_EXTRA_ARGS: "--no-dev"

build_tag:
  extends: .build
  only:
    - tags
  variables:
    IMAGE_TAG: $CI_COMMIT_TAG
    UV_EXTRA_ARGS: "--no-dev"

.image_defaults:
  image: $CI_REGISTRY_IMAGE:ci-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  before_script:
    - cd /app

.lint_tools:
  extends: .image_defaults
  allow_failure: false
  tags:
    - kube-dev
  only:
    - branches
  except:
    - schedules
  stage: lint
  needs:
    - build
  variables:
    GIT_STRATEGY: clone

ruff:
  extends: .lint_tools
  script:
    - uv run --active ruff check openprocurement/ --force-exclude
    - uv run --active ruff format openprocurement/ --check --force-exclude

mypy:
  extends: .lint_tools
  script:
    - uv run --active mypy openprocurement/ --explicit-package-bases

# CS-22510. Security flow, stage `lint`. Bandit checks our own code and blocks
# from day one. osv_scanner and gitleaks run in observation mode until
# OSV_BLOCKING / GITLEAKS_BLOCKING are set to "true" in the project settings.
bandit:
  extends: .lint_tools
  script:
    - uv run --active bandit -r . -c pyproject.toml

# Not extended from .lint_tools: it uses only/except, which cannot be
# combined with the rules block that switches allow_failure.
osv_scanner:
  stage: lint
  tags:
    - kube-dev
  image:
    name: $OSV_SCANNER_IMAGE
    entrypoint: [""]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH && $OSV_BLOCKING == "true"
      allow_failure: false
    - if: $CI_COMMIT_BRANCH
      allow_failure: true
  variables:
    GIT_STRATEGY: clone
  script:
    - /osv-scanner scan source -r .
        --offline-vulnerabilities --download-offline-databases --no-resolve
        --format html --output-file osv-report.html || true
    - /osv-scanner scan source -r .
        --offline-vulnerabilities --download-offline-databases --no-resolve
        --format vertical
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - osv-report.html

gitleaks:
  stage: lint
  tags:
    - kube-dev
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: [""]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH && $GITLEAKS_BLOCKING == "true"
      allow_failure: false
    - if: $CI_COMMIT_BRANCH
      allow_failure: true
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "50"
  script:
    - |
      if [ -n "$CI_COMMIT_BEFORE_SHA" ] \
         && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
         && git cat-file -e "$CI_COMMIT_BEFORE_SHA" 2>/dev/null; then
        RANGE="$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"
      else
        RANGE="-n 50"
      fi
      echo "gitleaks: scanning commits $RANGE"
      gitleaks git . --redact --verbose \
        --report-format json --report-path gitleaks-report.json \
        --log-opts="-m $RANGE"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - gitleaks-report.json

.base_deploy: &base_deploy
  stage: deploy
  script:
    - helm3 repo add prozorro $REPO_URL
    - helm3 repo update
    - helm3 upgrade $APP_NAME-$CI_COMMIT_REF_SLUG --install prozorro/$HELM_CHART --namespace $HELM_NAMESPACE --set $HELM_TAG_PARAMETER=$TAG --wait --debug
  tags:
    - shell
  variables:
    APP_NAME: audit-api
    TAG: latest

review:
  <<: *base_deploy
  environment:
    name: review/${CI_COMMIT_REF_SLUG}
    action: start
    url: http://$APP_NAME-${CI_COMMIT_REF_SLUG}.${K8S_DOMAIN}/api/2.5/monitorings
    on_stop: stop_review
  variables:
    APP_NAME: audit-api
    TAG: ci-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  dependencies:
    - build
  only:
    - branches
  except:
    - master
    - schedules
  when: manual    

deploy_master:
  <<: *base_deploy
  environment:
    name: review/${CI_COMMIT_REF_SLUG}
    url: http://$APP_NAME-${CI_COMMIT_REF_SLUG}.${K8S_DOMAIN}/api/2.5/monitorings
  dependencies:
    - build_master
  only:
    - master
  except:
    - schedules

stop_review:
  stage: deploy
  script:
    - helm3 uninstall audit-api-$CI_COMMIT_REF_SLUG
  environment:
    name: review/${CI_COMMIT_REF_SLUG}
    action: stop
  tags:
    - shell
  only:
    - branches
  except:
    - master
    - schedules
  when: manual

.test:
  image: $CI_REGISTRY_IMAGE:$TAG
  stage: test
  services:
    - name: bitnamilegacy/mongodb:6.0.13-debian-11-r9
      alias: mongo
  tags:
    - kube-dev
  only:
    - branches
  except:
    - schedules
  dependencies:
    - build
  variables:
    TAG: ci-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA

.test_main:
  extends: .test
  script:
    - cd /app
    - uv sync --frozen
    - py.test $TESTS_PATH -v
      --color=yes
      --cov=$COV_PATH
      --cov-config=$COV_FILE
      --cov-report xml
      --dist=each
      --tx=popen//id=sand//env:DB_NAME=test_sandbox//env:SANDBOX_MODE=1
      --tx=popen//id=prod//env:DB_NAME=test_prod//env:SANDBOX_MODE=
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'

test_api:
  extends: .test_main
  variables:
    TESTS_PATH: openprocurement/audit
    COV_PATH: openprocurement/audit
    COV_FILE: .coveragerc

test_docs:
  extends: .test
  before_script:
    - cd /app
    - uv sync --frozen
  script:
    - py.test docs.py
  when: manual

deploy_sandbox2:
  tags:
    - k8s-sandbox
  stage: deploy
  only:
    - tags
  script:
    - rm -rf ./k8s-sandbox
    - git config --global user.email "gitlab@gitlab.dc.prozorro.gov.ua"
    - git config --global user.name "GitLab CI/CD Bot"
    - git clone git@git.prozorro.gov.ua:DP/k8s-sandbox.git
    - cd k8s-sandbox
    - cat sandbox/charts/prozorro-audit/values.yaml | python -c "import sys; import yaml; file=sys.stdin.read(); dct=yaml.safe_load(file); dct['image']['tag'] = '$CI_COMMIT_TAG'; print yaml.dump(dct)" >out
    - mv out sandbox/charts/prozorro-audit/values.yaml
    - git add sandbox/charts/prozorro-audit/values.yaml
    - git commit -m "Audit API image tag changed to $CI_COMMIT_TAG"
    - git push origin master
  when: manual
